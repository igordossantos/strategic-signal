name: Build AI digest
run-name: >-
  Strategic Signal digest ${{ inputs.request_id || 'manual' }} ·
  ${{ inputs.intent }} · ${{ inputs.depth }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Request id generated by Strategic Signal
        required: true
        type: string
      intent:
        description: Digest intent
        required: true
        default: brief
        type: choice
        options:
          - brief
          - customer
          - learn
          - executive
      depth:
        description: Digest depth
        required: true
        default: standard
        type: choice
        options:
          - concise
          - standard
          - deep
      audience:
        description: Optional audience
        required: false
        default: ""
        type: string
      instructions:
        description: Optional additional instructions
        required: false
        default: ""
        type: string
      selection_json:
        description: Selected item evidence JSON generated by the app
        required: true
        type: string
      dry_run:
        description: Validate the request without calling Azure OpenAI
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Azure OpenAI digest
        id: digest
        continue-on-error: true
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
          DIGEST_REQUEST_ID: ${{ inputs.request_id }}
          DIGEST_INTENT: ${{ inputs.intent }}
          DIGEST_DEPTH: ${{ inputs.depth }}
          DIGEST_AUDIENCE: ${{ inputs.audience }}
          DIGEST_INSTRUCTIONS: ${{ inputs.instructions }}
          DIGEST_DRY_RUN: ${{ inputs.dry_run }}
          SELECTION_JSON: ${{ inputs.selection_json }}
        run: |
          mkdir -p data/digest-run
          set +e
          dry_flag=""
          if [[ "$DIGEST_DRY_RUN" == "true" ]]; then
            dry_flag="--dry-run"
          fi
          npm run digest -- \
            $dry_flag \
            --request-id "$DIGEST_REQUEST_ID" \
            --intent "$DIGEST_INTENT" \
            --depth "$DIGEST_DEPTH" \
            --audience "$DIGEST_AUDIENCE" \
            --instructions "$DIGEST_INSTRUCTIONS" \
            --selection-json "$SELECTION_JSON" \
            --output "data/digest-run/digest.json" \
            2>&1 | tee data/digest-run/execution.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Upload digest result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: strategic-signal-digest-${{ inputs.request_id }}
          path: data/digest-run/
          if-no-files-found: error
          retention-days: 30

      - name: Report digest failure
        if: steps.digest.outcome == 'failure'
        run: |
          echo "::error::Digest generation failed. Download execution.log for the explicit Azure OpenAI error."
          exit 1
